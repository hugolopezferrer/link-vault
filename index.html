<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links App - Gestor de Enlaces</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card .label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Form */
        .form-section {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .form-section h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Tags Selector */
        .tags-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag-checkbox {
            display: none;
        }

        .tag-label {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .tag-label:hover {
            border-color: var(--primary);
        }

        .tag-checkbox:checked + .tag-label {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Tag colors */
        .tag-ver-mas-tarde:checked + .tag-label { background: var(--danger); border-color: var(--danger); }
        .tag-revisar:checked + .tag-label { background: var(--warning); border-color: var(--warning); }
        .tag-compartir:checked + .tag-label { background: var(--success); border-color: var(--success); }
        .tag-desarrollar:checked + .tag-label { background: var(--primary); border-color: var(--primary); }
        .tag-urgente:checked + .tag-label { background: var(--danger); border-color: var(--danger); }
        .tag-referencia:checked + .tag-label { background: #8b5cf6; border-color: #8b5cf6; }
        .tag-favorito:checked + .tag-label { background: #ec4899; border-color: #ec4899; }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .filter-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-tag {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Links List */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .link-card:hover {
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .link-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .link-url {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }

        .link-url:hover {
            text-decoration: underline;
        }

        .link-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .link-note {
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }

        .link-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .tag-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tag-badge.ver-mas-tarde { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .tag-badge.revisar { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .tag-badge.compartir { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-badge.desarrollar { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
        .tag-badge.urgente { background: rgba(239, 68, 68, 0.3); color: #f87171; }
        .tag-badge.referencia { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
        .tag-badge.favorito { background: rgba(236, 72, 153, 0.2); color: #f472b6; }

        .link-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-delete {
            padding: 0.4rem 0.75rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Date Headers */
        .date-header {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin: 1.5rem 0 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(1rem);
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.75rem;
            }

            .filters {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔗 Links App</h1>
            <p>Tu gestor de enlaces organizado por fecha y tags</p>
        </header>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="total-links">0</div>
                <div class="label">Enlaces</div>
            </div>
            <div class="stat-card">
                <div class="number" id="total-days">0</div>
                <div class="label">Días</div>
            </div>
            <div class="stat-card">
                <div class="number" id="total-tags">0</div>
                <div class="label">Tags usados</div>
            </div>
        </div>

        <!-- Add Link Form -->
        <div class="form-section">
            <h2>➕ Agregar Nuevo Enlace</h2>
            <form id="add-form">
                <div class="form-group">
                    <label for="url">URL del enlace</label>
                    <input type="text" id="url" placeholder="https://ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="note">Nota descriptiva</label>
                    <textarea id="note" placeholder="¿De qué trata este enlace?" required></textarea>
                </div>
                <div class="form-group">
                    <label>Tags (selecciona los que apliquen)</label>
                    <div class="tags-selector">
                        <input type="checkbox" id="tag-ver-mas-tarde" class="tag-checkbox tag-ver-mas-tarde" value="ver-mas-tarde">
                        <label for="tag-ver-mas-tarde" class="tag-label">⏰ Ver más tarde</label>

                        <input type="checkbox" id="tag-revisar" class="tag-checkbox tag-revisar" value="revisar">
                        <label for="tag-revisar" class="tag-label">🔄 Revisar</label>

                        <input type="checkbox" id="tag-compartir" class="tag-checkbox tag-compartir" value="compartir">
                        <label for="tag-compartir" class="tag-label">📤 Compartir</label>

                        <input type="checkbox" id="tag-desarrollar" class="tag-checkbox tag-desarrollar" value="desarrollar">
                        <label for="tag-desarrollar" class="tag-label">💡 Desarrollar</label>

                        <input type="checkbox" id="tag-urgente" class="tag-checkbox tag-urgente" value="urgente">
                        <label for="tag-urgente" class="tag-label">🔥 Urgente</label>

                        <input type="checkbox" id="tag-referencia" class="tag-checkbox tag-referencia" value="referencia">
                        <label for="tag-referencia" class="tag-label">📚 Referencia</label>

                        <input type="checkbox" id="tag-favorito" class="tag-checkbox tag-favorito" value="favorito">
                        <label for="tag-favorito" class="tag-label">⭐ Favorito</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">💾 Guardar Enlace</button>
            </form>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="search-box">
                <input type="text" id="search" placeholder="Buscar enlaces...">
            </div>
            <div class="filter-tags" id="filter-tags">
                <button class="filter-tag active" data-tag="">Todos</button>
                <button class="filter-tag" data-tag="ver-mas-tarde">⏰ Ver más tarde</button>
                <button class="filter-tag" data-tag="revisar">🔄 Revisar</button>
                <button class="filter-tag" data-tag="compartir">📤 Compartir</button>
                <button class="filter-tag" data-tag="desarrollar">💡 Desarrollar</button>
                <button class="filter-tag" data-tag="urgente">🔥 Urgente</button>
                <button class="filter-tag" data-tag="referencia">📚 Referencia</button>
                <button class="filter-tag" data-tag="favorito">⭐ Favorito</button>
            </div>
        </div>

        <!-- Links List -->
        <div class="links-list" id="links-list">
            <div class="empty-state">
                <div class="icon">📭</div>
                <p>No hay enlaces guardados todavía</p>
                <p>Usa el formulario de arriba para agregar tu primer enlace</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // State
        let links = JSON.parse(localStorage.getItem('links-app') || '[]');
        let currentFilter = '';
        let searchQuery = '';

        // DOM Elements
        const addForm = document.getElementById('add-form');
        const linksList = document.getElementById('links-list');
        const searchInput = document.getElementById('search');
        const filterTags = document.getElementById('filter-tags');
        const toast = document.getElementById('toast');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderLinks();
            updateStats();
        });

        // Add Link Form
        addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            let url = document.getElementById('url').value.trim();
            const note = document.getElementById('note').value.trim();
            
            // Add https:// if missing
            if (!url.match(/^https?:\/\//)) {
                url = 'https://' + url;
            }

            // Get selected tags
            const tags = [];
            document.querySelectorAll('.tag-checkbox:checked').forEach(cb => {
                tags.push(cb.value);
            });

            const link = {
                id: Date.now(),
                url: url,
                note: note,
                tags: tags,
                date: new Date().toISOString()
            };

            links.unshift(link);
            saveLinks();
            renderLinks();
            updateStats();
            
            // Reset form
            addForm.reset();
            document.querySelectorAll('.tag-checkbox').forEach(cb => cb.checked = false);
            
            showToast('Enlace guardado correctamente');
        });

        // Search
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderLinks();
        });

        // Filter Tags
        filterTags.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-tag')) {
                document.querySelectorAll('.filter-tag').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.tag;
                renderLinks();
            }
        });

        // Delete Link
        function deleteLink(id) {
            if (confirm('¿Eliminar este enlace?')) {
                links = links.filter(link => link.id !== id);
                saveLinks();
                renderLinks();
                updateStats();
                showToast('Enlace eliminado');
            }
        }

        // Save to localStorage
        function saveLinks() {
            localStorage.setItem('links-app', JSON.stringify(links));
        }

        // Render Links
        function renderLinks() {
            let filtered = links;

            // Filter by tag
            if (currentFilter) {
                filtered = filtered.filter(link => link.tags.includes(currentFilter));
            }

            // Filter by search
            if (searchQuery) {
                filtered = filtered.filter(link => 
                    link.url.toLowerCase().includes(searchQuery) ||
                    link.note.toLowerCase().includes(searchQuery) ||
                    link.tags.some(tag => tag.toLowerCase().includes(searchQuery))
                );
            }

            if (filtered.length === 0) {
                linksList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <p>No se encontraron enlaces</p>
                        <p>${searchQuery || currentFilter ? 'Prueba con otros filtros' : 'Agrega tu primer enlace'}</p>
                    </div>
                `;
                return;
            }

            // Group by date
            const grouped = {};
            filtered.forEach(link => {
                const date = new Date(link.date).toLocaleDateString('es-ES', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                if (!grouped[date]) grouped[date] = [];
                grouped[date].push(link);
            });

            let html = '';
            for (const [date, dateLinks] of Object.entries(grouped)) {
                html += `<div class="date-header">📅 ${date}</div>`;
                dateLinks.forEach(link => {
                    html += `
                        <div class="link-card">
                            <div class="link-header">
                                <a href="${link.url}" class="link-url" target="_blank" rel="noopener">${link.url}</a>
                                <span class="link-date">${formatTime(link.date)}</span>
                            </div>
                            <p class="link-note">${escapeHtml(link.note)}</p>
                            ${link.tags.length > 0 ? `
                                <div class="link-tags">
                                    ${link.tags.map(tag => `<span class="tag-badge ${tag}">${getTagIcon(tag)} ${formatTag(tag)}</span>`).join('')}
                                </div>
                            ` : ''}
                            <div class="link-actions">
                                <button class="btn-delete" onclick="deleteLink(${link.id})">🗑️ Eliminar</button>
                            </div>
                        </div>
                    `;
                });
            }

            linksList.innerHTML = html;
        }

        // Update Stats
        function updateStats() {
            const days = new Set(links.map(l => new Date(l.date).toDateString())).size;
            const tags = new Set(links.flatMap(l => l.tags)).size;
            
            document.getElementById('total-links').textContent = links.length;
            document.getElementById('total-days').textContent = days;
            document.getElementById('total-tags').textContent = tags;
        }

        // Show Toast
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Helpers
        function formatTime(iso) {
            return new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        }

        function formatTag(tag) {
            return tag.replace(/-/g, ' ');
        }

        function getTagIcon(tag) {
            const icons = {
                'ver-mas-tarde': '⏰',
                'revisar': '🔄',
                'compartir': '📤',
                'desarrollar': '💡',
                'urgente': '🔥',
                'referencia': '📚',
                'favorito': '⭐'
            };
            return icons[tag] || '🏷️';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
