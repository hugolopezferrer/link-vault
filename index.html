<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Vault - Gestor de Enlaces</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card .label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Form */
        .form-section {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .form-section h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Tags Selector */
        .tags-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag-checkbox {
            display: none;
        }

        .tag-label {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .tag-label:hover {
            border-color: var(--primary);
        }

        /* Tag colors */

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .filter-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-tag {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Links List */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .link-card:hover {
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .link-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .link-url {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }

        .link-url:hover {
            text-decoration: underline;
        }

        .link-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .link-note {
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }

        .link-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .tag-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .link-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-delete {
            padding: 0.4rem 0.75rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }


        /* Edit button */
        .btn-edit {
            padding: 0.4rem 0.75rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            color: #818cf8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .btn-edit:hover {
            background: var(--primary);
            color: white;
        }

        /* Cancel edit button */
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text);
        }

        /* Backup tools */
        .tools {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-tool {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .btn-tool:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Date Headers */
        .date-header {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin: 1.5rem 0 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(1rem);
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.75rem;
            }

            .filters {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔗 Link Vault</h1>
            <p>Tu gestor de enlaces organizado por fecha y tags</p>
        </header>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="total-links">0</div>
                <div class="label">Enlaces</div>
            </div>
            <div class="stat-card">
                <div class="number" id="total-days">0</div>
                <div class="label">Días</div>
            </div>
            <div class="stat-card">
                <div class="number" id="total-tags">0</div>
                <div class="label">Tags usados</div>
            </div>
        </div>

        <!-- Add Link Form -->
        <div class="form-section">
            <h2>➕ Agregar Nuevo Enlace</h2>
            <form id="add-form">
                <div class="form-group">
                    <label for="url">URL del enlace</label>
                    <input type="text" id="url" placeholder="https://ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="note">Nota descriptiva</label>
                    <textarea id="note" placeholder="¿De qué trata este enlace?" required></textarea>
                </div>
                <div class="form-group">
                    <label>Tags (selecciona los que apliquen)</label>
                    <div class="tags-selector" id="tags-selector"></div>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary">💾 Guardar Enlace</button>
                <button type="button" id="cancel-edit" class="btn btn-secondary" style="display:none" onclick="cancelEdit()">Cancelar edición</button>
            </form>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="search-box">
                <input type="text" id="search" placeholder="Buscar enlaces...">
            </div>
            <div class="filter-tags" id="filter-tags">
                <button class="filter-tag active" data-tag="">Todos</button>
            </div>
        </div>

        <!-- Backup tools -->
        <div class="tools">
            <button class="btn-tool" onclick="exportLinks()">📥 Exportar JSON</button>
            <button class="btn-tool" onclick="document.getElementById('import-file').click()">📤 Importar JSON</button>
            <input type="file" id="import-file" accept="application/json,.json" style="display:none">
        </div>

        <!-- Links List -->
        <div class="links-list" id="links-list">
            <div class="empty-state">
                <div class="icon">📭</div>
                <p>No hay enlaces guardados todavía</p>
                <p>Usa el formulario de arriba para agregar tu primer enlace</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Tags: single source of truth (form, filters and badges are generated from here)
        const TAGS = [
            { id: 'ver-mas-tarde', label: 'Ver más tarde', icon: '⏰', color: '#ef4444', soft: 'rgba(239,68,68,0.2)',  text: '#f87171' },
            { id: 'revisar',       label: 'Revisar',        icon: '🔄', color: '#f59e0b', soft: 'rgba(245,158,11,0.2)', text: '#fbbf24' },
            { id: 'compartir',      label: 'Compartir',      icon: '📤', color: '#10b981', soft: 'rgba(16,185,129,0.2)', text: '#34d399' },
            { id: 'desarrollar',    label: 'Desarrollar',    icon: '💡', color: '#6366f1', soft: 'rgba(99,102,241,0.2)',  text: '#818cf8' },
            { id: 'urgente',        label: 'Urgente',        icon: '🔥', color: '#ef4444', soft: 'rgba(239,68,68,0.3)',  text: '#f87171' },
            { id: 'referencia',     label: 'Referencia',     icon: '📚', color: '#8b5cf6', soft: 'rgba(139,92,246,0.2)', text: '#a78bfa' },
            { id: 'favorito',       label: 'Favorito',       icon: '⭐', color: '#ec4899', soft: 'rgba(236,72,153,0.2)', text: '#f472b6' },
        ];

        function tagInfo(id) {
            return TAGS.find(t => t.id === id) ||
                { id: id, label: id.replace(/-/g, ' '), icon: '🏷️', color: '#64748b', soft: 'rgba(100,116,139,0.2)', text: '#94a3b8' };
        }

        // State (migrates the old 'links-app' key once)
        let links = JSON.parse(localStorage.getItem('link-vault') || localStorage.getItem('links-app') || '[]');
        let currentFilter = '';
        let searchQuery = '';
        let editingId = null;

        // DOM Elements
        const addForm = document.getElementById('add-form');
        const linksList = document.getElementById('links-list');
        const searchInput = document.getElementById('search');
        const filterTags = document.getElementById('filter-tags');
        const toast = document.getElementById('toast');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderTagSelectors();
            renderLinks();
            updateStats();
            document.getElementById('import-file').addEventListener('change', (e) => {
                if (e.target.files[0]) importLinks(e.target.files[0]);
                e.target.value = '';
            });
        });

        // Generate tag checkboxes and filter buttons from TAGS
        function renderTagSelectors() {
            const sel = document.getElementById('tags-selector');
            sel.innerHTML = TAGS.map(t => `
                <input type="checkbox" id="tag-${t.id}" class="tag-checkbox" value="${t.id}">
                <label for="tag-${t.id}" class="tag-label">${t.icon} ${t.label}</label>`).join('');
            sel.querySelectorAll('.tag-checkbox').forEach(cb => {
                cb.addEventListener('change', paintTagLabels);
            });
            TAGS.forEach(t => {
                const b = document.createElement('button');
                b.className = 'filter-tag';
                b.dataset.tag = t.id;
                b.textContent = `${t.icon} ${t.label}`;
                filterTags.appendChild(b);
            });
            paintTagLabels();
        }

        // Paint selected tag labels with their color
        function paintTagLabels() {
            document.querySelectorAll('#tags-selector .tag-checkbox').forEach(cb => {
                const label = cb.nextElementSibling;
                const t = tagInfo(cb.value);
                if (cb.checked) {
                    label.style.background = t.color;
                    label.style.borderColor = t.color;
                    label.style.color = '#fff';
                } else {
                    label.style.background = '';
                    label.style.borderColor = '';
                    label.style.color = '';
                }
            });
        }

        // Add / Edit Link Form
        addForm.addEventListener('submit', (e) => {
            e.preventDefault();

            let url = document.getElementById('url').value.trim();
            const note = document.getElementById('note').value.trim();

            // Add https:// if missing
            if (!url.match(/^https?:\/\//)) {
                url = 'https://' + url;
            }

            // Get selected tags
            const tags = [];
            document.querySelectorAll('.tag-checkbox:checked').forEach(cb => {
                tags.push(cb.value);
            });

            if (editingId !== null) {
                const link = links.find(l => l.id === editingId);
                if (link) {
                    link.url = url;
                    link.note = note;
                    link.tags = tags;
                    showToast('Enlace actualizado');
                }
                cancelEdit();
            } else {
                const link = {
                    id: Date.now() * 1000 + Math.floor(Math.random() * 1000),
                    url: url,
                    note: note,
                    tags: tags,
                    date: new Date().toISOString()
                };
                links.unshift(link);
                showToast('Enlace guardado correctamente');
            }

            saveLinks();
            renderLinks();
            updateStats();

            // Reset form
            addForm.reset();
            paintTagLabels();
        });

        // Edit Link: preload the form
        function editLink(id) {
            const link = links.find(l => l.id === id);
            if (!link) return;
            document.getElementById('url').value = link.url;
            document.getElementById('note').value = link.note;
            document.querySelectorAll('.tag-checkbox').forEach(cb => {
                cb.checked = link.tags.includes(cb.value);
            });
            paintTagLabels();
            editingId = id;
            document.getElementById('submit-btn').textContent = '💾 Guardar cambios';
            document.getElementById('cancel-edit').style.display = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            addForm.reset();
            paintTagLabels();
            document.getElementById('submit-btn').textContent = '💾 Guardar Enlace';
            document.getElementById('cancel-edit').style.display = 'none';
        }

        // Export links to a JSON file
        function exportLinks() {
            const blob = new Blob([JSON.stringify(links, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'link-vault-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('Respaldo descargado');
        }

        // Import links from a JSON file
        function importLinks(file) {
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    if (!Array.isArray(data)) throw new Error('formato inválido');
                    const ids = new Set(links.map(l => l.id));
                    let added = 0;
                    data.forEach(l => {
                        if (!l || typeof l.url !== 'string') return;
                        if (l.id == null || ids.has(l.id)) {
                            l.id = Date.now() * 1000 + Math.floor(Math.random() * 1000);
                        }
                        ids.add(l.id);
                        links.push({
                            id: l.id,
                            url: l.url,
                            note: l.note || '',
                            tags: Array.isArray(l.tags) ? l.tags : [],
                            date: l.date || new Date().toISOString()
                        });
                        added++;
                    });
                    saveLinks();
                    renderLinks();
                    updateStats();
                    showToast(added + ' enlace(s) importados');
                } catch (err) {
                    showToast('Archivo inválido');
                }
            };
            reader.readAsText(file);
        }

        // Search
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderLinks();
        });

        // Filter Tags
        filterTags.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-tag')) {
                document.querySelectorAll('.filter-tag').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.tag;
                renderLinks();
            }
        });

        // Delete Link
        function deleteLink(id) {
            if (confirm('¿Eliminar este enlace?')) {
                links = links.filter(link => link.id !== id);
                saveLinks();
                renderLinks();
                updateStats();
                showToast('Enlace eliminado');
            }
        }

        // Save to localStorage
        function saveLinks() {
            localStorage.setItem('link-vault', JSON.stringify(links));
            localStorage.removeItem('links-app');
        }

        // Render Links
        function renderLinks() {
            let filtered = links;

            // Filter by tag
            if (currentFilter) {
                filtered = filtered.filter(link => link.tags.includes(currentFilter));
            }

            // Filter by search
            if (searchQuery) {
                filtered = filtered.filter(link =>
                    link.url.toLowerCase().includes(searchQuery) ||
                    link.note.toLowerCase().includes(searchQuery) ||
                    link.tags.some(tag => tag.toLowerCase().includes(searchQuery))
                );
            }

            if (filtered.length === 0) {
                linksList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <p>No se encontraron enlaces</p>
                        <p>${searchQuery || currentFilter ? 'Prueba con otros filtros' : 'Agrega tu primer enlace'}</p>
                    </div>
                `;
                return;
            }

            // Group by date
            const grouped = {};
            filtered.forEach(link => {
                const date = new Date(link.date).toLocaleDateString('es-ES', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                if (!grouped[date]) grouped[date] = [];
                grouped[date].push(link);
            });

            let html = '';
            for (const [date, dateLinks] of Object.entries(grouped)) {
                html += `<div class="date-header">📅 ${date}</div>`;
                dateLinks.forEach(link => {
                    html += `
                        <div class="link-card">
                            <div class="link-header">
                                <a href="${link.url}" class="link-url" target="_blank" rel="noopener">${link.url}</a>
                                <span class="link-date">${formatTime(link.date)}</span>
                            </div>
                            <p class="link-note">${escapeHtml(link.note)}</p>
                            ${link.tags.length > 0 ? `
                                <div class="link-tags">
                                    ${link.tags.map(t => {
                                        const ti = tagInfo(t);
                                        return `<span class="tag-badge" style="background:${ti.soft};color:${ti.text}">${ti.icon} ${ti.label}</span>`;
                                    }).join('')}
                                </div>
                            ` : ''}
                            <div class="link-actions">
                                <button class="btn-edit" onclick="editLink(${link.id})">✏️ Editar</button>
                                <button class="btn-delete" onclick="deleteLink(${link.id})">🗑️ Eliminar</button>
                            </div>
                        </div>
                    `;
                });
            }

            linksList.innerHTML = html;
        }

        // Update Stats
        function updateStats() {
            const days = new Set(links.map(l => new Date(l.date).toDateString())).size;
            const tags = new Set(links.flatMap(l => l.tags)).size;

            document.getElementById('total-links').textContent = links.length;
            document.getElementById('total-days').textContent = days;
            document.getElementById('total-tags').textContent = tags;
        }

        // Show Toast
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Helpers
        function formatTime(iso) {
            return new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
