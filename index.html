<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links App - Gestor de Enlaces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
            font-size: 1.05em;
        }

        .form-section, .filter-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-section h2, .filter-section h2 {
            margin-bottom: 18px;
            color: #2c3e50;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
            margin-left: 8px;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-row input {
            flex: 1;
            min-width: 180px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .date-group {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .date-header {
            background: #ecf0f1;
            padding: 12px 20px;
            font-weight: 700;
            color: #2c3e50;
            border-bottom: 2px solid #e0e6ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date-count {
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .link-item {
            padding: 18px 20px;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .link-item:last-child {
            border-bottom: none;
        }

        .link-content {
            flex: 1;
            min-width: 0;
        }

        .link-url {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
            display: block;
            margin-bottom: 6px;
        }

        .link-url:hover {
            text-decoration: underline;
        }

        .link-note {
            color: #555;
            font-size: 0.95em;
            margin-bottom: 4px;
        }

        .link-time {
            color: #95a5a6;
            font-size: 0.82em;
        }

        .btn-delete {
            background: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #e74c3c;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #95a5a6;
            background: white;
            border-radius: 12px;
        }

        .empty-state h3 {
            margin-bottom: 8px;
        }

        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 140px;
            background: white;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-number {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.6em;
            }
            .filter-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔗 Links App</h1>
            <p>Tu organizador personal de enlaces con notas</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalLinks">0</div>
                <div class="stat-label">Total de enlaces</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalDays">0</div>
                <div class="stat-label">Días registrados</div>
            </div>
        </div>

        <div class="form-section">
            <h2>➕ Agregar nuevo enlace</h2>
            <form id="linkForm">
                <div class="form-group">
                    <label for="url">URL *</label>
                    <input type="url" id="url" placeholder="https://ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="note">Nota</label>
                    <textarea id="note" placeholder="¿De qué se trata este enlace?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Guardar enlace</button>
            </form>
        </div>

        <div class="filter-section">
            <h2>🔍 Buscar y filtrar</h2>
            <div class="filter-row">
                <input type="text" id="searchInput" placeholder="Buscar por texto o URL...">
                <input type="date" id="dateFilter">
                <button class="btn btn-secondary" id="clearFilters">Limpiar</button>
            </div>
        </div>

        <div class="links-container" id="linksContainer"></div>
    </div>

    <script>
        const STORAGE_KEY = 'linksApp_data';

        let links = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        function saveLinks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
        }

        function addLink(url, note) {
            const now = new Date();
            const link = {
                id: Date.now().toString(),
                url: url,
                note: note,
                date: now.toISOString().split('T')[0],
                time: now.toTimeString().split(' ')[0]
            };
            links.unshift(link);
            saveLinks();
            render();
        }

        function deleteLink(id) {
            if (confirm('¿Eliminar este enlace?')) {
                links = links.filter(l => l.id !== id);
                saveLinks();
                render();
            }
        }

        function getFilteredLinks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const dateFilter = document.getElementById('dateFilter').value;

            return links.filter(link => {
                const matchesSearch = !searchTerm ||
                    link.url.toLowerCase().includes(searchTerm) ||
                    link.note.toLowerCase().includes(searchTerm);
                const matchesDate = !dateFilter || link.date === dateFilter;
                return matchesSearch && matchesDate;
            });
        }

        function render() {
            const filtered = getFilteredLinks();
            const container = document.getElementById('linksContainer');

            document.getElementById('totalLinks').textContent = links.length;
            const uniqueDays = new Set(links.map(l => l.date)).size;
            document.getElementById('totalDays').textContent = uniqueDays;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>📭 No hay enlaces</h3>
                        <p>Agrega tu primer enlace usando el formulario de arriba.</p>
                    </div>
                `;
                return;
            }

            const grouped = {};
            filtered.forEach(link => {
                if (!grouped[link.date]) grouped[link.date] = [];
                grouped[link.date].push(link);
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

            container.innerHTML = sortedDates.map(date => `
                <div class="date-group">
                    <div class="date-header">
                        <span>📅 ${formatDate(date)}</span>
                        <span class="date-count">${grouped[date].length}</span>
                    </div>
                    ${grouped[date].map(link => `
                        <div class="link-item">
                            <div class="link-content">
                                <a href="${link.url}" target="_blank" rel="noopener" class="link-url">${link.url}</a>
                                ${link.note ? `<div class="link-note">${escapeHtml(link.note)}</div>` : ''}
                                <div class="link-time">🕐 ${link.time}</div>
                            </div>
                            <button class="btn-delete" onclick="deleteLink('${link.id}')">Eliminar</button>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('linkForm').addEventListener('submit', e => {
            e.preventDefault();
            const url = document.getElementById('url').value.trim();
            const note = document.getElementById('note').value.trim();
            if (url) {
                addLink(url, note);
                document.getElementById('url').value = '';
                document.getElementById('note').value = '';
            }
        });

        document.getElementById('searchInput').addEventListener('input', render);
        document.getElementById('dateFilter').addEventListener('change', render);
        document.getElementById('clearFilters').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFilter').value = '';
            render();
        });

        render();
    </script>
</body>
</html>
